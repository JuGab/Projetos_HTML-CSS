<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table{
            border: 1px solid black;
            border-collapse: collapse;
            width: 400px;
            
        }

        thead,tfoot{
            background-color: gainsboro;
            font-size: large;
            text-align: center;
        }

        td,th{
            border: 1px solid black;
            padding: 5px;
        }



    </style>
</head>
<body>
    <h1>Anatomia de tabelas grandes</h1>

    <!--
    TABLE
        THEAD
            TR, TD, TH
        TBODY
            TR, TD, TH
        TFOOTER
            TR, TD, TH
    -->

    <table>

        <thead>

            <tr>
                <th>
                    Estado
                </th>

                <th>
                    População
                </th>

            </tr>
        

        </thead>


        <tbody>

            <tr>

                <td>São Paulo</td>
                <td>46 081 801</td>

            </tr>

            <tr>
                <td>Minas Gerais</td>
                <td>21 393 441</td>
            </tr>

            <tr>
                <td>Rio de Janeiro</td>
                <td>17 223 547</td>
            </tr>



        </tbody>

        <tfoot>

            <th>Total de Habitantes</th>
            <td>00000</td>
            
        </tfoot>

    </table>
    
</body>
</html>
