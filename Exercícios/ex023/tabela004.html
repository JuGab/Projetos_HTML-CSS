<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Tabela</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 450px;
            border-collapse: collapse;
        }

        caption{
            font-size: large;
            font-weight: bold;
            padding-bottom: 5px;
        }

        th,td{
            border: 1px solid black;
            padding: 10px;
        }

        .verde{
            background-color: green;
        }

        .amarelo{
            background-color: yellow;
        }

        .vermelho{
            background-color: red;
        }

    </style>
</head>
<body>
    <h1>Exercício de tabela</h1>

    <table>
        <colgroup>
        <col class="verde" span="2">
        <col class="amarelo" span="2">
        </colgroup>

        <caption>Cadastro</caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>24</td>
            <td>Jornalista</td>
        </tr>

         <tr>
            <td>Pedro Sampaio</td>
            <td>M</td>
            <td>18</td>
            <td>Multi-Instrumentalista</td>
        </tr>

         <tr>
            <td>Ofélia Alcantra</td>
            <td>F</td>
            <td>52</td>
            <td>Artista Plastica</td>
        </tr>

         <tr>
            <td>Bianca Gabriela</td>
            <td>F</td>
            <td>21</td>
            <td>Programadora</td>
        </tr>

    </table>
    
</body>
</html>
