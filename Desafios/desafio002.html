<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
     <style>
        table{
            width: 300px;
            text-align: center;
        }
        td{
            border: 1px solid black;
            padding: 15px;
        }
    </style>
</head>
<body>

    <h1>Desafio 2 junção de tabelas</h1>
    
   
    <table>

        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
        </tr>

        <tr>
            <td rowspan="4">D</td>
            <td colspan="2">E</td>
            <td rowspan="2">F</td>
            
           
        </tr>

        <tr>
            
            <td rowspan="2">H</td>
            <td>I</td>

        </tr>

        <tr>
           
            <td colspan="2">G</td>
        
            
        </tr>


        <tr>
            <td colspan="4">C</td>
        </tr>

    </table>
    
</body>
</html>
