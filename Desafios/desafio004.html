<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>

        table{
            width: 500px;
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
            
        }

      

        th{
            background-color: gray;
            color: white;
            font-size: large;
        }



        th,td{
            border: 1px solid black;
            padding: 10px 15px;
            text-align: center;
        }


        .media{
            text-align: left;
        }



    </style>
</head>
<body>

    <h1>Tabela Notas</h1>

    <table>
        <tr>
            <th rowspan="2" scope="col" >Área</th>
            <th rowspan="2" scope="col">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2" scope="col">Média</th>
            
            
        </tr>

        <tr>
            <th scope="col">Nota 1</th>
            <th scope="col">Nota 2</th>
        </tr>


        <tr>
            <td rowspan="4" ><strong>Exatas</strong></td>

            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

         <tr>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

          <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        
        <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <th class="media" colspan="4" scope="row">Média de exatas</th>
            <th>0.0</th>
        </tr>

         <tr>
        <td rowspan="2"><strong>Humanas</strong></td>

            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <th class="media" colspan="4" scope="row">Média de humanas</th>
            <th>0.0</th>
        </tr>




    </table>
    
</body>
</html>
